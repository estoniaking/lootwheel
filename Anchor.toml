[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
loot_wheel_secure = "LWMG9yMBkvUzJh5LWTXypkGTYSyetZB9e73iKqfaZ82"

[programs.localnet]
loot_wheel_secure = "LWMG9yMBkvUzJh5LWTXypkGTYSyetZB9e73iKqfaZ82"

[programs.mainnet]
loot_wheel_secure = "LWMG9yMBkvUzJh5LWTXypkGTYSyetZB9e73iKqfaZ82"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/live_keys/deployment.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Note: SPL Memo program (MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr) is optional.
# The contract handles missing memo program gracefully - memos are logged when available
# (mainnet/devnet) and skipped when not (localnet without cloning).
